[versions]
# The floor protobus is compiled and tested against. Generated code from
# protoc 3.25 runs on every protobuf-java 3.25.x and 4.x runtime, so a
# project on either line can depend on protobus without changing its own.
protobuf = "3.25.9"
# The newest runtime, tested in CI alongside the floor.
protobufLatest = "4.36.2"
amqp = "5.37.0"
slf4j = "2.0.17"
junit = "5.14.4"
protobufPlugin = "0.9.6"

[libraries]
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
amqp-client = { module = "com.rabbitmq:amqp-client", version.ref = "amqp" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
