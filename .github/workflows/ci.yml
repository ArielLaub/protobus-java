name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # The suites never default to a broker; these point them at the service
  # containers below.
  PROTOBUS_TEST_AMQP_URL: amqp://guest:guest@127.0.0.1:25672/
  PROTOBUS_TEST_MGMT_URL: http://guest:guest@127.0.0.1:25673

jobs:
  unit:
    name: unit (${{ matrix.os }}, Java ${{ matrix.java }}, protobuf-java ${{ matrix.protobuf }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        java: ["17", "21"]
        protobuf: ["3.25.9", "4.36.2"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 21 builds (the toolchain); the matrix's version runs the tests.
          java-version: |
            ${{ matrix.java }}
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: build, every unit suite, doc snippets, javadoc (warnings are errors)
        run: ./gradlew build -PtestJava=${{ matrix.java }} -PprotobufRuntime=${{ matrix.protobuf }}

  integration:
    name: integration (RabbitMQ ${{ matrix.rabbitmq }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rabbitmq: ["3-management", "4-management"]
    services:
      rabbitmq:
        image: rabbitmq:${{ matrix.rabbitmq }}
        ports:
          - 25672:5672
          - 25673:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: integration suite
        run: ./gradlew :protobus:integrationTest
      - name: examples run end to end
        env:
          AMQP_URL: amqp://guest:guest@127.0.0.1:25672/
          LOG_LEVEL: warn
        run: ./gradlew :examples:runCalculator :examples:runTokenstream :examples:runCombat

  cross-language:
    name: cross-language (Java <-> TypeScript <-> Python <-> Go <-> C++)
    runs-on: ubuntu-24.04
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 25672:5672
          - 25673:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: protobus-java
      # The peers are pinned: bump deliberately, after their own CI passes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArielLaub/protobus
          ref: e442c51062870def92754b9e79ba36d49c9374d4 # 2.5.0 + docs
          path: protobus
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArielLaub/protobus-py
          ref: c0397f2108f5786514f8909a17ecf12f7a02d73a
          path: protobus-py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArielLaub/protobus-go
          ref: 311814ebd54e1b74d15d9a1301df1470d9cf44f3
          path: protobus-go
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArielLaub/protobus-cpp
          ref: 3302250139c5214ef1724be74ddc871f6f452d12
          path: protobus-cpp
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: protobus-go/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: build the TypeScript port
        working-directory: protobus
        run: npm ci && npm run build-ts
      - name: install the Python port
        working-directory: protobus-py
        run: python -m venv venv && venv/bin/pip install -e .
      - name: build the C++ peer
        working-directory: protobus-cpp
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build libprotobuf-dev libprotoc-dev protobuf-compiler librabbitmq-dev libgtest-dev
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPROTOBUS_BUILD_EXAMPLES=OFF
          cmake --build build --target cpppeer
      - name: cross-language suite
        working-directory: protobus-java
        env:
          PROTOBUS_TS: ${{ github.workspace }}/protobus
          PROTOBUS_PY: ${{ github.workspace }}/protobus-py
          PROTOBUS_GO: ${{ github.workspace }}/protobus-go
          PROTOBUS_CPP: ${{ github.workspace }}/protobus-cpp
        run: ./gradlew :crosslang:test
